name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  syntax-and-imports:
    name: Syntax + import smoke test (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.10"
            os: ubuntu-latest
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyflakes

      - name: Byte-compile every file (catches syntax errors)
        run: python -m compileall -q .

      - name: Import every module (catches real NameError/ImportError at import time)
        run: python .github/scripts/check_imports.py

      - name: Lint with pyflakes (informational only)
        run: pyflakes zora/ || true

  install-script:
    name: install.sh end-to-end
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run install.sh
        run: |
          chmod +x install.sh uninstall.sh
          ./install.sh

      - name: zora command works after install
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          zora --help

      - name: Run uninstall.sh
        run: |
          echo "n" | ./uninstall.sh

      - name: Launcher is actually gone after uninstall
        run: |
          if [ -f "$HOME/.local/bin/zora" ]; then
            echo "::error::uninstall.sh did not remove the launcher"
            exit 1
          fi

  gitignore-check:
    name: No tracked runtime artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Fail if a zora_report_*.json was accidentally committed
        run: |
          if git ls-files | grep -E 'zora_report_.*\.json$'; then
            echo "::error::Found a committed zora_report_*.json — these are runtime output and should be gitignored."
            exit 1
          fi
          echo "Clean."
